name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: proofbill
          POSTGRES_PASSWORD: proofbill
          POSTGRES_DB: proofbill_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U proofbill" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://proofbill:proofbill@localhost:5432/proofbill_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter web build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
