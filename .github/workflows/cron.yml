name: Scheduled jobs
# For deployments without a worker/cron service (Render free web service).
# Set repo secrets APP_URL (e.g. https://proofbill-web.onrender.com) and CRON_SECRET (same value as on Render).
on:
  schedule:
    - cron: "*/10 * * * *" # tick: repo polling, AI evidence mapping, auto-accept (also keeps a free instance warm)
    - cron: "15 */6 * * *" # collections: reminders, late fees, reconciliation
  workflow_dispatch:
    inputs:
      job:
        description: "tick or collections"
        default: tick

jobs:
  call:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || (github.event.schedule == '15 */6 * * *' && 'collections' || 'tick') }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL/CRON_SECRET not set — skipping"; exit 0; fi
          # A sleeping free instance can take ~1 min to wake; allow for it.
          curl -fsS --retry 3 --retry-delay 20 --max-time 280 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$JOB"
